<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="200" r="400" fill="url(#glow)"/>
  <rect x="24" y="24" width="1152" height="582" rx="32" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Pill Badge -->
  <g transform="translate(420, 110)">
    <rect width="360" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="4" fill="#10b981"/>
    <text x="36" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">100% ON-DEVICE ENGINE</text>
  </g>

  <!-- Main Website Brand Header (Wrench Icon Box + BrowserKit text) -->
  <g transform="translate(180, 200)">
    <!-- Wrench Box Icon -->
    <rect width="96" height="96" rx="24" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <g transform="translate(24, 24) scale(2)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </g>

    <!-- Typography matching site -->
    <text x="124" y="68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="72" letter-spacing="-2">
      <tspan fill="#ffffff">BROWSER</tspan><tspan fill="#64748b">KIT.</tspan>
    </text>
  </g>

  <!-- Tagline Text -->
  <text x="600" y="360" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5">
    PRIVATE CLIENT-SIDE UTILITIES.
  </text>

  <text x="600" y="415" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
    Compress images, convert formats, merge PDFs, remove backgrounds &amp; encrypt files locally.
  </text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(210, 480)">
    <rect x="0" y="0" width="160" height="42" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="80" y="26" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="700">Image Compressor</text>

    <rect x="180" y="0" width="170" height="42" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="265" y="26" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="700">Background Remover</text>

    <rect x="370" y="0" width="150" height="42" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="445" y="26" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="700">Format Converter</text>

    <rect x="540" y="0" width="120" height="42" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="600" y="26" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="700">PDF Tools</text>

    <rect x="680" y="0" width="100" height="42" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="730" y="26" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="700">ZIP Vault</text>
  </g>
</svg>
